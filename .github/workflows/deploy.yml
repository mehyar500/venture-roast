name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'public/**', 'functions/**', 'wrangler.toml', '.github/workflows/deploy.yml', 'package.json' ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g wrangler@3
      # Committed wrangler.toml [vars] is the complete authoritative var set
      # (no secrets in it), so no temp-toml injection is needed here.
      - run: wrangler pages deploy public --project-name=venture-roast --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
